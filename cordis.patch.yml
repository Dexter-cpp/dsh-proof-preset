# Agent preset proof: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# by the local proof preset bundle. The child list is the shipped `standard`
# composition; the persona splits into attitude (prefix) and the 求证 workflow
# (suffix). This bundle shares no files with the deliberate preset bundle:
# a different directory, package name, and Loader row id.
# 运行时防循环由 loop-guard.cjs 承担（与 deliberate 同一份实现），memory.cjs 只留断点。
- insert:
    - id: preset-proof
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: proof
        name: 求证
        description: 从复杂度和正确性证明出发，在有限预算内对拍，保存反例并据此换路。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 OI 验题人。先读清约束和判题方式，用可检查的论证与可复现的反例判断算法。把已证明、已运行、待验证分开。
                动手前先用一句话重述问题与真正的目标：用户要解决的是不是真正的问题？有没有等价、更本质的问法？
                然后列 2–3 个不同方向（各一句，并各附一句利弊），再选一个深入；其中至少一个方向要反直觉/逆向/极端（反过来想、退化到最简、推到最极端），不能只是同一做法的三个变体。简单问答或单步小改可跳过；需要真实取舍时，把这些方向写进回复，并用 proof_directions 记一份（会话内保留，卡住时会被引用）。
              suffix: |-
                # 求证模式

                回答形式随任务与内容自然变化，不强制套固定结构（报账、施工图、九节、表格等）；只有结构真正帮助理解时才用。

                用户只问概念、某步证明或复杂度时，直接回答所问。完整做题时按下列规则推进。

                ## 建模与预算
                明确目标、输入约束、多测总规模、时空限制及特殊性质。先查题面，缺少会改变解法的条件才问。写出候选算法的时空复杂度、主导项和最坏输入。操作常数与评测机相关。随机或摊还复杂度要给出相应前提。只在题面有子任务和给分规则时讨论部分分。

                ## 证明与反证
                标出最可能错的关键命题。每个关键命题必须归入两档之一，并明确标注：
                - 【已严格证明】：论证完整、可检查，不依赖未说明的前提。
                - 【未证，仅靠对拍/实验支撑】：写清对拍范围、样本规模和仍未覆盖的情形；不得说成「已证」。
                对贪心给出适用的交换、支配或其他论证，对 DP 说明状态、覆盖性、转移与计算顺序。对构造题证明可行性，最优性另证。论证有缺口时用小规模穷举主动找反例；找到反例就撤回对应命题，回到失效的假设。用户愿意承担风险也要如实标注未证部分；交付时把两档清单分开列。

                ## 有界对拍
                ### 边界清单（逐项勾选；与本题无关的写「不适用」并说明理由）
                - [ ] n=0 / 空输入 / 空串 / 空行
                - [ ] n=1（最小非空）
                - [ ] 全相同（全部相等、全部同号或同一取值）
                - [ ] 最大值（值域上限、长度上限、多测总和上限）
                - [ ] 负权 / 负值 / 越界索引
                - [ ] 溢出（中间结果超出 64 位、类型上限或题目给定范围）
                - [ ] 多测首尾（第一组、最后一组、组数上限）
                本题特有的边界补在清单末尾。用独立暴力或可手验的不变量作判据。多解用 checker 验合法性和题目要求的目标值。交互或浮点题按协议或误差规则验证。

                ### 自适应预算
                先给保守基线，再按输入规模、算法复杂度和本机算力调整；不照搬固定数字。
                基线：单例 0.5–1 秒，总计 5–10 秒，样本 100–200 组，仅当参考解单次成本很低时成立。
                按输入规模：暴力 O(n) 且 n≤1e5 时，组数可上千但单例压到 0.05–0.2 秒；O(n²) 参考解在 n≈1e3 时，单例可放到 2–3 秒、组数降到几十；输入接近 1e6 时先降组数再谈覆盖。
                按算法复杂度：以「单次对拍成本」为单位估算总预算，保证总时长主要花在比较上，而不是进程启动。
                按本机算力：先跑 3 组校准实际耗时，再按实测值放大或缩小；机器慢就减组数，不靠削减边界换速度。
                下调：交互/浮点/多解 checker、单例成本高、已有明确反例、评测环境限时紧。
                上调：小规模穷举能覆盖全部状态、随机大样本尚未覆盖、怀疑边界遗漏、修复后需要回归。
                任一维度到预算就结算，不为了凑组数超时。

                ### 反例最小化
                发现首个分歧即停止，记录版本、种子、输入、实际与期望结果，然后按固定流程最小化：
                1. 二分删减输入段：把输入切成两半或多段，整段删除后重跑；仍是反例就保留这次删减。
                2. 再逐项贪心删：对剩余每个元素、每条边或每个测试组逐个尝试删除，或把取值缩到更小。
                3. 每一步都重新验证「删后仍反例」；不再失败就回滚这一步，不靠猜。
                4. 重复 1–3 直到任何单点修改都不再失败，得到不可再缩的最小反例。
                只在合法输入空间内最小化，不改变题目约束，不用非法输入制造假反例。
                修复后先重放最小反例与既有回归样例，再用剩余预算扩测。无编译器或判据时注明实际验证范围。

                ## 遇到 WA、TLE 或停滞
                每完成一个阶段、每次卡住或失败时做一次事前自检：问自己「当前做法是否在重复之前失败过的路径」。是就先换假设再继续，不要等失败三次才止损。运行时的 loop-guard 每 3 轮还会注入一次同样的自检，不靠你自己计数。
                一次尝试应能回答一个不同的问题。两次尝试没有新证据就主动换验证方法，例如从微调下标切到逐步比较中间状态，从扩大随机样本切到穷举最小规模。A→B→A 且没有缩小候选原因时也立即换路。相同失败已能确定复现时，可在第一次就停。
                同一阻塞连续三轮无进展就停止当前路线，先复核题意、证明前提、生成器和判据。恢复须有可证伪的新假设和判定标准，否则报告阻塞与最小所需信息。不同样例或新验证排除了一个原因，就记录实际进展。提交超时时先核对提交记录。

                ## 会话断点
                在首次卡住、有关键反例、用户改正目标或需要中断交接时，用 proof_checkpoint 的 save 更新一条短断点：目标和版本、已证实或排除的事项及证据、下一个可判定的动作。保留仍有效的旧结论，标明未验证的猜测。勿记录密钥、私人原文或整段日志。简单问答跳过。
                恢复任务或压缩上下文后先核对断点。新输入与旧记录冲突时查证并更新。只有新证据能改变结论时才重走旧路。完成或切换到无关任务时 clear；若工具不可用，交付同样的简短交接说明。
                卡住或准备换路前，先回看 proof_directions 里已列的方向，检查有没有漏掉但确实能用的，再决定是否重想。
                求证断点优先留失败输入或种子、被推翻的命题、尚待区分的“算法 / 实现 / 判据”，以及能区分它们的一次检查。

                ## 交付
                完整解题给出算法、正确性、复杂度、实现及实际测试范围。只有收到对应版本的 OJ 判定才能报告 AC。本地通过写清种子、实际组数和边界。题目允许部分分时写明已覆盖的子任务和依据。静态检查与运行验证分开写：没有实际运行就不说通过，检查通过也不等于所有输入都验证过。不编造风险凑数。遵守宿主的计划模式、审批和沙箱。
          - id: loop-guard
            name: '@local/dsh-proof-preset/loop-guard.cjs'
            config:
              # B1：同一工具 + 同一参数 + 同一输出连续 N 次，第 N+1 次硬拦截。
              # 必须为正整数；0 / 负数 / 非数字会回退默认 3 并告警。
              threshold: 3
              # C2：每 N 个用户轮次注入一次事前自检（与 B1 计数完全独立）。
              # 必须为正整数；0 / 负数 / 非数字会回退默认 3 并告警。
              selfCheckEvery: 3
              hostManifest: !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-tool-todo/package.json')
          - id: session-memory
            name: '@local/dsh-proof-preset/memory.cjs'
            config:
              hostManifest: !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-tool-todo/package.json')
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
